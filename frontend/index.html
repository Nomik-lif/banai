<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BanAI Wardrobe Designer</title>
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="topbar__title">BanAI <span>Wardrobe Designer</span></h1>
      <div class="topbar__actions">
        <label class="toggle">
          <input type="checkbox" id="toggle-interior" />
          <span>Show interior</span>
        </label>
        <span class="topbar__units">cm</span>
      </div>
    </header>
    <div class="banner banner--error" id="error-banner" role="alert" hidden></div>
    <main class="workspace">
      <aside class="panel panel--chat" id="chat-panel" aria-label="AI designer">
        <h2 class="panel__title">AI Designer</h2>
        <div id="chat-content" style="height:100%;min-height:0;display:flex;flex-direction:column;"></div>
      </aside>
      <section class="viewer" id="viewer" aria-label="3D viewer"></section>
      <aside class="panel panel--properties" id="properties-panel" aria-label="Properties">
        <h2 class="panel__title">Properties</h2>
        <p class="panel__hint">Click a component in the 3D view to edit it.</p>
        <div id="properties-content"></div>
      </aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
